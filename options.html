<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Auto Allow Tool</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>ChatGPT Auto Allow Tool</h1>

      <label class="row">
        <input id="enabled" type="checkbox">
        <span>자동 허용 사용</span>
      </label>

      <label>
        클릭 지연 시간(ms)
        <input id="clickDelayMs" type="number" min="0" max="10000" step="50">
      </label>

      <label>
        허용할 도구 이름
        <input id="allowedTools" type="text" placeholder="비워두면 모든 도구 허용">
      </label>

      <label>
        자동 클릭 제외 키워드
        <input id="deniedKeywords" type="text" placeholder="비워두면 제외 없이 클릭">
      </label>

      <label>
        플러그인 자동 새로고침 주기(시간)
        <input id="autoRefreshHours" type="number" min="0" max="720" step="1" placeholder="0이면 자동 새로고침 안 함">
      </label>

      <p>플러그인 새로고침은 버튼 클릭 후 바로 다음 플러그인으로 이동합니다. 서버 처리 완료는 기다리지 않습니다.</p>

      <label class="row">
        <input id="autoContinueEnabled" type="checkbox">
        <span>자동 이어서 진행 기본값</span>
      </label>
      <p>탭별 설정이 없는 ChatGPT 탭에 적용됩니다. 현재 탭만 바꾸려면 확장프로그램 팝업을 사용하세요.</p>

      <label>
        자동 입력 문구
        <input id="autoContinuePrompt" type="text" placeholder="이어서 진행">
      </label>

      <label>
        자동 이어서 진행 횟수
        <input id="autoContinueMaxTurns" type="number" min="1" max="100" step="1">
      </label>

      <p id="status" role="status"></p>
      <button id="save" type="button">저장</button>

      <section aria-labelledby="diagnosticHeading">
        <h2 id="diagnosticHeading">자동화 진단 로그</h2>
        <p>플러그인 새로고침과 자동 이어서 진행의 오류 시각, 확장 버전, 실패 단계와 경과 시간을 이 기기에 최근 100건까지 저장합니다. 대화 내용과 MCP 주소는 수집하지 않습니다.</p>
        <p id="diagnosticStatus" role="status"></p>
        <label for="diagnosticLog">오류 로그</label>
        <textarea id="diagnosticLog" rows="12" readonly spellcheck="false"></textarea>
        <div class="row">
          <button id="refreshLog" type="button">로그 새로고침</button>
          <button id="copyLog" type="button" disabled>로그 복사</button>
        </div>
      </section>
    </main>

    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
