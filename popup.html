<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Auto Allow Tool</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon48.png" alt="" width="32" height="32">
        <div>
          <h1>Auto Allow</h1>
          <p id="stateText">상태 확인 중</p>
        </div>
      </header>

      <label class="toggle">
        <span>자동 허용</span>
        <input id="enabled" type="checkbox">
      </label>

      <label class="toggle">
        <span>이 탭 자동 이어서 진행</span>
        <input id="autoContinueEnabled" type="checkbox" disabled>
      </label>
      <p id="autoContinueScope" role="status">현재 탭 확인 중</p>
      <p id="autoContinueStatus" role="status"></p>

      <dl>
        <div>
          <dt>지연</dt>
          <dd id="delayText">-</dd>
        </div>
        <div>
          <dt>허용 목록</dt>
          <dd id="allowText">-</dd>
        </div>
      </dl>

      <label class="toggle">
        <span>권한 표시 없는 앱도 확인 (느림)</span>
        <input id="inspectAllPlugins" type="checkbox">
      </label>
      <button id="refreshPlugins" type="button">연결 플러그인 전체 새로고침</button>
      <p id="refreshStatus" role="status" aria-live="polite">대기 중</p>
      <button id="options" type="button">옵션 열기</button>
    </main>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
