    padding: 0 36px; box-sizing: border-box; color: #fff;

      radial-gradient(320px 260px at 100% 100%, rgba(20, 184, 166, 0.55), transparent 70%),

    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; align-items: center; gap: 16px; }
  img { width: 68px; height: 68px; border-radius: 16px; box-shadow: 0 10px 24px rgba(0,0,0,.3), 0 0 0 1px rgba(255,255,255,.15); }
  h1 { margin: 0; font-size: 27px; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em; }
  p { margin: 0; color: #c9ece6; font-size: 19px; font-weight: 500; }

</head>

  <div class="row">
    <img src="../../../icons/icon128.png" alt="">

</html>
